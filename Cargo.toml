[package]
name = "feightstick"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Native FEI microscope control panel input driver and gamepad bridge"
license = "AGPL-3.0"
authors = ["Hüseyin Çelik", "Tolga Wagner"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device", "windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"

[target.'cfg(target_os = "windows")'.dependencies]
vigem-client = "0.1.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[profile.dev]
lto = false
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
strip = "debuginfo"
incremental = false
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
lto = false
